[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hegemon"
version = "0.1.0"
description = "Adaptive evolutionary software repair agent for the Gemma 4 Developer Agent competition."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ybedoyab" }]
dependencies = []

[project.scripts]
hegemon = "hegemon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "submission"]
