# Official shape from HARNESS_README.md (downloaded 2026-11-25): keys live under evaluation.
# timeout_seconds is the per-command cap, not the task cap.
# Agent time excludes container setup. 5 minutes * ~120 tasks stays inside a 12 hour run
# only if sandbox setup stays modest. This is a budget hypothesis, not a measured optimum.
evaluation:
  timeout_seconds: 120
  max_tool_calls: 24
  max_time_minutes: 5
  max_turns: 40
